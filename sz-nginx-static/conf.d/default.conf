server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    access_log /var/log/nginx/default.access.log;
    error_log /var/log/nginx/default.error.log;

    location = /resource {
        return 301 /resource/;
    }

    location /resource/ {
        alias /data/;
        autoindex off;   # 不想列目录就 off；想临时列目录可改 on
        try_files $uri =404;
    }
}
