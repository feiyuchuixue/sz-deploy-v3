server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    access_log /var/log/nginx/default.access.log;
    error_log /var/log/nginx/default.error.log;

    location = /resource {
        return 301 /resource/;
    }

    # 只公开明确标记为 LOCAL + DIRECT 的资源目录。
    # PROTECTED 目录必须由业务接口鉴权读取，不能加入此白名单。
    location /resource/logo/ {
        alias /data/logo/;
        autoindex off;
        try_files $uri =404;
    }

    location /resource/teacher-richtext/ {
        alias /data/teacher-richtext/;
        autoindex off;
        try_files $uri =404;
    }

    location /resource/richtext/ {
        alias /data/richtext/;
        autoindex off;
        try_files $uri =404;
    }

    location /resource/temp/ {
        alias /data/temp/;
        autoindex off;
        try_files $uri =404;
    }

    location /resource/ {
        return 404;
    }
}
