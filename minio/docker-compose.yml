services:
  minio:
    image: ${MINIO_IMAGE:-registry.cn-beijing.aliyuncs.com/sz-dev/minio:latest}
    container_name: ${MINIO_CONTAINER:-minio}
    restart: always
    ports:
      - "${OSS_API_PORT:-9000}:9000"   # S3 API端口
      - "${OSS_CONSOLE_PORT:-9001}:9001"   # 控制台端口
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-SZADMIN}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-Sz2025@123456}
      MINIO_SITE_REGION: ${OSS_REGION:-us-east-1}
      MINIO_DOMAIN: ${OSS_SERVER_DOMAINS:-}
    volumes:
      - ./data:/data        # 数据卷
      - ./config:/root/.minio # 配置文件
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - sz-network

networks:
  sz-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-sz-network}
