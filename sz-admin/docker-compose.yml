services:
  sz-admin:
    image: ${SZ_ADMIN_IMAGE:-registry.cn-beijing.aliyuncs.com/sz-dev/sz-admin:latest}
    container_name: sz-admin
    restart: always
    ports:
      - "9800:9800"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    networks:
      - sz-network
networks:
  sz-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-sz-network}
