services:
  app:
    image: ${NPM_IMAGE:-registry.cn-beijing.aliyuncs.com/sz-dev/nginx-proxy-manager-zh:latest}
    container_name: ${NPM_CONTAINER:-nginx-proxy-manager}
    restart: always
    ports:
      - '${NPM_HTTP_PORT:-80}:80'
      - '${NPM_ADMIN_PORT:-81}:81'
      - '${NPM_HTTPS_PORT:-443}:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - sz-network
networks:
  sz-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-sz-network}
