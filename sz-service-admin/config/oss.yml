# 仓库默认配置仅启用 LOCAL 场景。实际环境如需 OSS，请提供完整、自持的 profile oss.yml。
# 选择 provider 不会自动改变资源场景的存储类型。
sz:
  oss:
    # 支持S3协议的厂商
    provider: MINIO
    addressing-style: PATH
    bucket-name: test
    region: us-east-1
    scheme: https
    # endpoint、domain、access-key、secret-key 由实际环境配置文件显式提供。
    # 未配置 endpoint 时不会创建 S3 客户端；不要在仓库默认文件中保存真实凭据。
  # LOCAL 资源目录。Docker 部署时 /data 由宿主机 RESOURCE_DATA_DIR 持久化挂载。
  resource:
    root: /data
    default-storage-type: LOCAL
    security:
      allowed-exts: [jpg, jpeg, png, gif, bmp, webp, svg, ico, pdf, doc, docx, xls, xlsx, ppt, pptx, rtf, txt, csv, zip, rar, 7z, tar, gz, mp3, wav, ogg, mp4, mov, avi, wmv]
      max-size: 50MB
    scenes:
      - code: admin.user.logo
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/logo
        path: logo
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [svg, png, jpg, jpeg, webp, gif]
        max-size: 3MB
      - code: template.excel
        type: LOCAL
        serve-mode: PROTECTED
        path: template
        naming: ORIGINAL
        path-strategy: DATE
        exts: [xls, xlsx]
        max-size: 10MB
      - code: teacher.attachment
        type: LOCAL
        serve-mode: PROTECTED
        path: teacher-attachments
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10MB
      - code: teacher.richtext
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/teacher-richtext
        path: teacher-richtext
        naming: UUID
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 5MB
      - code: system.richtext
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/richtext
        path: richtext
        naming: UUID
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 5MB
      - code: system.temp
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/temp
        path: temp
        naming: ORIGINAL
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10MB
      - code: system.protected
        type: LOCAL
        serve-mode: PROTECTED
        path: protected
        naming: ORIGINAL
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10MB
