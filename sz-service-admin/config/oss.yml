# 此文件需结合minio配置进行修改或调整
sz:
  oss:
    # 支持S3协议的厂商
    provider: MINIO
    endpoint: minio:9000
    accessKey: OM7unN89MF3RUsD5RILv
    secretKey: keSYozaRWqqYVoI1vp4R1Rs0ImdcAlOHVRepRxsL
    bucketName: test
    # 资源文件访问域名
    domain: http://192.168.124.57:9000
    # 命名方式: UUID、ORIGINAL原文件名偏好，冲突会补充时间
    naming: original
    scheme: https
  # LOCAL 资源目录。Docker 部署时 /data 由宿主机 RESOURCE_DATA_DIR 持久化挂载。
  resource:
    root: /data
    default-storage-type: LOCAL
    security:
      allowed-exts: [jpg, jpeg, png, gif, bmp, webp, svg, ico, pdf, doc, docx, xls, xlsx, ppt, pptx, rtf, txt, csv, zip, rar, 7z, tar, gz, mp3, wav, ogg, mp4, mov, avi, wmv]
    max-size: 50MB
    scenes:
      - code: admin.user.logo
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/logo
        path: logo
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [svg, png, jpg, jpeg, webp, gif]
        max-size: 3
      - code: template.excel
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/template
        path: template
        naming: ORIGINAL
        path-strategy: DATE
        exts: [xls, xlsx]
        max-size: 10
      - code: teacher.attachment
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/teacher-attachments
        path: teacher-attachments
        naming: ORIGINAL
        path-strategy: BIZ_DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10
      - code: teacher.richtext
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/teacher-richtext
        path: teacher-richtext
        naming: UUID
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 5
      - code: system.temp
        type: LOCAL
        serve-mode: DIRECT
        base-url: /resource/temp
        path: temp
        naming: ORIGINAL
        path-strategy: DATE
        exts: [png, jpg, jpeg, webp, gif, pdf, doc, docx, xls, xlsx]
        max-size: 10
