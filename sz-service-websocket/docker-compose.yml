services:
  sz-service-websocket:
    image: ${SZ_SERVICE_WEBSOCKET_IMAGE:-registry.cn-beijing.aliyuncs.com/sz-dev/sz-service-websocket:latest}
    container_name: ${SZ_SERVICE_WEBSOCKET_CONTAINER:-sz-service-websocket}
    restart: always
    ports:
      - "${SZ_SERVICE_WEBSOCKET_PORT:-9993}:9993"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - ./logs:/logs
      - ./data:/data
      - ${ADMIN_CONFIG_DIR:-/home/docker-compose/sz-service-admin/config}:/config
    networks:
      - sz-network
networks:
  sz-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-sz-network}
